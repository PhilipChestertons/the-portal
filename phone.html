<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .iphone-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
}

.device {
    position: relative;
    width: 375px; /* iPhone width */
    height: 812px; /* iPhone height */
    background: #000;
    border-radius: 40px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.screen {
    position: absolute;
    top: 4%;
    left: 6%;
    width: 88%;
    height: 92%;
    background: #fff;
    border-radius: 30px;
    overflow: hidden;
}

.screen iframe {
    width: 100%;
    height: 100%;
    border: none;
}

</style>
<body>
    <div class="iphone-frame">
        <div class="device">
            <div class="screen">
                <iframe src="index.html" frameborder="0"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
