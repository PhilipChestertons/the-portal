    /* Smooth transition for fieldset appearance */
    fieldset {
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      border: none;
      padding: 0;
      margin: 0;
    }

    [x-cloak] { display: none !important; }

    /* Button-style radio group */
    .button-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center; /* Center alignment */
    }

    .button-group label {
      flex: 1;
      display: inline-block;
      text-align: center;
      min-width: 150px;
    }

    /* Mobile: Stack buttons vertically */
    @media (max-width: 600px) {
      .button-group {
        flex-direction: column;
        align-items: stretch;
      }

      .button-group label {
        width: 100%;
      }
    }

    /* Ensure .horizontal button groups stay inline */
    .horizontal {
      flex-direction: row !important;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .horizontal label {
      width: auto;
      flex-grow: 1;
      text-align: center;
    }

    /* Hide the default radio input */
    .button-group input[type="radio"] {
      display: none;
    }

    /* Style the labels as buttons */
    .button-group label {
      cursor: pointer;
      border: 1px solid #A1A1AA;
      background-color: white;
      color: var(--pico-contrast-color);
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      transition: 0.2s;
      border-radius: 5px;
    }

    /* Checked (Active) State */
    .button-group input[type="radio"]:checked + label {
      background-color: #6C207E;
      color: var(--pico-primary-inverse);
      border-color: #6C207E;
    }

    /* Hover effect */
    .button-group label:hover {
      background-color: #F0E8F2;
    }

    /* Make it purple */
    [type=checkbox]:checked, 
    [type=checkbox]:checked:active, 
    [type=checkbox]:checked:focus, 
    [type=radio]:checked, 
    [type=radio]:checked:active, 
    [type=radio]:checked:focus {
        background-color: #6C207E;
        border-color: #6C207E;
    }

    input, select, textarea {
        border-color: #A1A1AA;
    }

    input:focus, input:focus-visible {
        border-color: #6C207E;
    }


    /*Did you know call out */
    .did-you-know {
    background-color: #F0E8F2;
    border-radius: 2em;
    padding: 1em;
    display: flex;
    flex-direction: column;
    align-items: center;
    }

    .did-you-know strong {
    color: #6C207E;
    }

    :is(button, [type="submit"], [type="button"], [role="button"]).outline, [type="reset"].outline {
        border-color: #6C207E;
        color: #6C207E;
}


.remove :is(button, [type="submit"], [type="button"], [role="button"]).outline, [type="reset"].outline {

}

}

/* Dialog buttons */
#saveDialog > article > footer > button.secondary {

}

#saveDialog > article > footer > button.primary {
  border-color: #6C207E;

}

:where(a:not([role=button])), [role=link]  {

}

#openDialog {

  .multi-progress {
    display: flex;
    flex-direction: column; /* Stack progress bars vertically */
    gap: 5px; /* Space between bars */
  }

  .progress-bar {
    display: flex;
    align-items: center;
    width: 100%;
    height: 20px;
    background-color: #FAFAFA; /* Light background */
    border-radius: 10px;
    overflow: hidden;
    margin-top: 4px;
    margin-bottom: 15px;
  }

  .progress-segment {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #0E9234;
    font-weight: bold;
    height: 100%;
  }

  .full.progress-segment  {
    color: #E9F9EF;
  }

  /* Optional: Add a subtle border for better visibility */
  .progress-bar {
    border: 1px solid #E0E0E0;
  }

  details[open]>summary:not([role]):not(:focus),
  :focus-visible {
    border-color: #6C207E;

  details.dropdown summary:not([role]):focus,
  details.dropdown summary:not([role]):hover,

/* Targeting the range input inside the label */
label input[type="range"] {
  width: 100%;
}

/* Custom styling for the range input */
input[type="range"] {
  accent-color: #e64097; /* Uses Pico’s primary color */
  appearance: none;
  height: 12px;
  background: var(--secondary-background);
  border-radius: 4px;
  border-color: #e64097;
}

/* Styling the thumb for Webkit browsers */
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 22px;
  height: 22px;
  background: #e64097;
  border-radius: 50%;
  border-color: #e64097;
  cursor: pointer;
}

/* Styling the thumb for Firefox */
input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  background: #e64097);
  border-radius: 50%;
  cursor: pointer;
  border-color: #e64097;
}
